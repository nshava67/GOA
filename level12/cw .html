<!--კომენტარის სახით ახსენით რაში გამოიყენება form-ები-->
<!--form არის თეგი რომელიც გამოიყენება ვებგვერდზე მომხმარებლისგან მონაცემის მისაღებად-->

<!--კომენტარის სახით ახსენით form, input, label თეგების დანიშნულება და მათი ატრიბუტები-->
<!--form თეგი გამოიყენება მომხრმარებლისგან მონაცემის მისაღებად,input თეგი გამოიყენება მონაცემის შესაყვანად,ხოლო label თეგი ამბობს თუ რა უნდა ჩავწეოთ input თეგში-->

<form>
<label for="fullname">სრულ სახელი:</label>
<input type="text" id="fullname"> <br><br>

<label for="email"></label>ემაილი:></label>
<input type="email" id="emial"><br><br>

<label for="password"></label>პაროლი:></label>
<input type="password" id="password"><br><br>

<label>სქესი:</label>
<input type="radio" id="male">
<label for="male">მამრობითი</label>
<input type="radio" id="female">
<label for="female">მდედრობითი</label><br><br>

<label for="birthday">დაბადების დღე:</label>
<input type="date" id="date"><br><br>

<label for="favourite colour">საყვარელი ფერი</label>
<input type="color" id="color"><br><br>

<button type="submit">გაგზავნა</button>



</form>
